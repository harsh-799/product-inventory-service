spring.application.name=product-inventory-service

# Server
server.port=${PORT:8080}

# Database Configuration (Defaults to local PostgreSQL, overridden in docker-compose)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/product_inventory_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (Safe demo default for evaluation; override via env in production)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Default Admin Initialization (Evaluation/Demo credentials)
admin.email=${DEF_ADMIN_USERNAME:admin@inventory.com}
admin.password=${DEF_ADMIN_PASSWORD:Admin@123}